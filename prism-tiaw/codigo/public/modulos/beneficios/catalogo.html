<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guia-Benefício</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/catalogo.css">
    <link rel="stylesheet" href="../../assets/css/styles.css">
    <link rel="icon" type="image/x-icon" href="../../assets/images/icon_site.png">
</head>

<body>
    <header class="headerMobile">
        <nav class="navbar navbar-dark bg-dark navbarMobile">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">
                    <img src="../../assets/images/logo_site.jpeg" alt="Logo" class="d-inline-block align-text-center">
                    <span style="color: #003CA3;">Guia-</span><span style="color: #2B7F3A">Benefício</span>
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarToggleExternalContent" aria-controls="navbarToggleExternalContent"
                    aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
            </div>
        </nav>
        <div class="collapse" id="navbarToggleExternalContent" data-bs-theme="dark">
            <nav class="botoesNavegacao">
                <a class="link-header" href="../../index.html">Início</a>
                <a class="link-header" href="../beneficios/catalogo.html">Benefícios</a>
                <a class="link-header" href="../forms/form.html">Recomendador</a><!-- Tem que linkar com o formulário! -->
                <a class="link-header" href="">Postos</a><!-- Tem que linkar com a página de Postos -->
                <a class="link-header" href="">Login</a><!-- Tem que linkar com a página de Login -->
            </nav>
        </div>
    </header>

    <header class="headerDesktop">
        <nav class="navbar navbar-dark navbarDesktop">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">
                    <img src="../../assets/images/logo_site.jpeg" alt="Logo" class="d-inline-block align-text-center">
                    <span style="color: #003CA3;">Guia-</span><span style="color: #2B7F3A">Benefício</span>
                </a>
                <nav class="botoesNavegacao">
                    <a class="link-header" href="../../index.html">Início</a>
                    <a class="link-header" href="../beneficios/catalogo.html">Benefícios</a>
                    <a class="link-header" href="../forms/form.html">Recomendador</a><!-- Tem que linkar com o formulário! -->
                    <a class="link-header" href="">Postos</a><!-- Tem que linkar com a página de Postos -->
                    <a class="botao-amarelo" href="">Login</a><!-- Tem que linkar com a página de Login -->
                </nav>
            </div>
        </nav>
    </header>

    <main class="mt-4">

        <div class="intro">

            <h1>Catálogo de Benefícios</h1>

            <p>
                Veja o catálogo de benefícios disponíveis e clique para mais detalhes.
            </p>

        </div>

        <div class="filtros">

            <input
                type="text"
                id="pesquisa"
                placeholder="Pesquisar benefício">

            <select id="filtro-categoria">
                <option value="">Todas as categorias</option>
                <option value="Alimentação">Alimentação</option>
                <option value="Moradia">Moradia</option>
                <option value="Energia">Energia</option>
                <option value="Assistência">Assistencia</option>
                <option value="Habitação">Habitação</option>
                <option value="Saúde">Saúde</option>
                <option value="Educação">Educação</option>
                <option value="Transporte">Transporte</option>
            </select>

            <select id="ordenacao">
                <option value="">Ordenar</option>
                <option value="maior">Maior valor</option>
                <option value="menor">Menor valor</option>
            </select>

            <button
                id="limpar-filtros"
                class="botao-azul">
                Limpar
            </button>

        </div>

        <div class="info-beneficios">

            <p id="contador-beneficios"></p>

            <p id="contador-favoritos">
                Favoritos: 0
            </p>

            <button
                id="mostrar-favoritos"
                class="botao-branco">
                Mostrar Favoritos
            </button>

        </div>

        <div
            class="beneficios"
            id="beneficios">
        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/catalogo.js"></script>

</body>

</html>
